services:
  server:
    build:
      context: .
    ports:
      - "8080:8000"
    environment:
      SQLITE_PATH: /app/data/db.sqlite3
    volumes:
      - sqlite_data:/app/data

  client:
    build:
      context: ./client-app
    ports:
      - "5173:8080"
    depends_on:
      - server

volumes:
  sqlite_data:
